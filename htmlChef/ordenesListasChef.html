<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones de Pedido - Chef</title>
    <link rel="stylesheet" href="../css/cssChef/ordenesListasChef.css">
    <!-- Fuentes importadas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chef-notificaciones">
        
        <!-- Barra Superior (Logo, Iconos) -->
        <div class="top-logo"></div>
        <div class="top-vector"></div>
        <img class="top-profile-image" src="../imagenes/logo.jpg" alt="Perfil">
        <img class="top-brand-image" src="../imagenes/icono.jpg" alt="Logo">

        <!-- Tarjeta de Notificación #1 -->
        <div class="notification-card card-1">
            <div class="notification-bg"></div>
            <h2 class="notification-title">¡Pedido listo!</h2>
            <p class="notification-message">
                La orden de la Mesa #4 <br>ha sido enviada al mesero.
            </p>
            <div class="button-primary btn-1">Aceptar</div>
        </div>

        <!-- Tarjeta de Notificación #2 -->
        <div class="notification-card card-2">
            <div class="notification-bg"></div>
            <h2 class="notification-title">¡Pedido listo!</h2>
            <p class="notification-message">
                La orden de la Mesa #5 <br>ha sido enviada al domiciliario.
            </p>
            <div class="button-primary btn-2">Aceptar</div>
        </div>

    </div>

</body>
</html>
