<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes Pendientes - Chef</title>
    <link rel="stylesheet" href="../css/cssChef/ordenesPendientesChef.css">
    <!-- Fuentes importadas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Inter:wght@400&family=Karla:wght@700&family=Manuale:wght@700&family=Markazi+Text:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="chef-ordenes">
        
        <!-- Barra Superior (Logo, Iconos) -->
        <div class="top-logo"></div>
        <div class="top-vector"></div>
        <img class="top-profile-image" src="../imagenes/logo.jpg" alt="Perfil">
        <img class="top-brand-image" src="../imagenes/icono.jpg" alt="Logo">

        <!-- Encabezado de la Sección -->
        <div class="section-header">
            <div class="section-header-bg"></div>
            <h1 class="section-title">Ordenes Pendientes</h1>
        </div>

        <!-- Tarjeta de Pedido #1 (Mesa #4) -->
        <div class="order-card card-1">
            <div class="order-card-bg"></div>
            
            <div class="order-header">
                <span class="order-table">Mesa #4</span>
                <span class="order-time">12:45PM</span>
            </div>

            <div class="order-type-badge badge-1">Restaurante</div>

            <div class="order-details">
                <p class="order-line">Pedido:</p>
                <p class="order-item">1x&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;arroz con leche de la abuela</p>
                <p class="order-item">2x&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;copa de tres leches</p>
            </div>

            <div class="order-note">Nota:Sin fresas</div>

            <div class="button-primary btn-listo-1">
                <span class="button-label">Pedido listo</span>
            </div>
        </div>

        <!-- Tarjeta de Pedido #2 (Mesa #5) -->
        <div class="order-card card-2">
            <div class="order-card-bg"></div>
            
            <div class="order-header">
                <span class="order-table">Mesa #5</span>
                <span class="order-time">2:35PM</span>
            </div>

            <div class="order-type-badge badge-2">Domicilio</div>

            <div class="order-details">
                <p class="order-line">Pedido:</p>
                <p class="order-item">1x&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Arepa rellena de queso</p>
                <p class="order-item">2x&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Picadas</p>
            </div>

            <div class="button-primary btn-listo-2">
                <span class="button-label">Pedido listo</span>
            </div>
        </div>

    </div>

</body>
</html>
