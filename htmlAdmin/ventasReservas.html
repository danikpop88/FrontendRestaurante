<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ventas y reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Karla:wght@400;700&family=Markazi+Text:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/cssAdmin/ventasReservas.css" />
</head>
<body>
  <div class="pantalla">

    <!-- Encabezado -->
    <a href="../htmlAdmin/Principal.html"><img class="header-usuario" src="../imagenes/logo.jpg" alt="Usuario" /></a>
    <a href="../htmlAdmin/Principal.html"><img class="logo" src="../imagenes/icono.jpg" alt="Logo" /></a>

    <!-- Título de sección -->
    <div class="barra-titulo"></div>
    <div class="titulo-seccion">Ventas y reservas</div>

    <!-- Filtros de periodo -->
    <div class="filtro filtro-diario" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="filtro-texto">Diario</div>
    </div>
    <div class="filtro filtro-semanal" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="filtro-texto">Semanal</div>
    </div>
    <div class="filtro filtro-mensual" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="filtro-texto">Mensual</div>
    </div>

    <!-- Botón informe -->
    <div class="boton-informe" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="boton-informe-texto">Revisar informe</div>
    </div>

    <!-- Tarjetas de resumen -->
    <div class="tarjeta tarjeta-1"></div>
    <div class="tarjeta tarjeta-2"></div>
    <div class="tarjeta tarjeta-3"></div>

    <div class="tarjeta-etiqueta etiqueta-ventas">Ventas totales:</div>
    <div class="tarjeta-etiqueta etiqueta-realizadas">Reservas realizadas:</div>
    <div class="tarjeta-etiqueta etiqueta-canceladas">Reservas canceladas:</div>

    <div class="tarjeta-valor valor-ventas">$450.000</div>
    <div class="tarjeta-valor valor-realizadas">8</div>
    <div class="tarjeta-valor valor-canceladas">2</div>

    <!-- Detalle de reservas canceladas -->
    <div class="detalle"></div>
    <div class="detalle-titulo">Detalle reservas canceladas:</div>

    <div class="detalle-fila detalle-fila-1">
      <span>Juan Pérez</span>
      <span>10/09/26 (8:00pm)</span>
    </div>
    <div class="detalle-fila detalle-fila-2">
      <span>Maria Gomez</span>
      <span>11/09/26 (1:30pm)</span>
    </div>

    <div class="icono-peligro" data-size="48">
      <div class="icono-peligro-borde"></div>
    </div>

  </div>

  <!-- Selector de fecha (en el diseño estaba fuera de la pantalla) -->
  <div class="selector-fecha">
    <div class="selector-fecha-texto">9/09/26</div>
    <div class="selector-fecha-icono" data-size="16">
      <div class="selector-fecha-flecha"></div>
    </div>
  </div>
</body>
</html>
