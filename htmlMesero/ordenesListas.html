<!DOCTYPE html>
<html lang="es">
<head>

  <title>Lista de Pedidos</title>
  <link rel="stylesheet" href="../css/cssMesero/ordenesListas.css">
  <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500&family=Abhaya+Libre:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">

    <!-- Separador rosado -->
    <div class="accent-bar"></div>

    <!-- Header: Lista de Pedidos Para entregar -->
    <div class="header header-entregar">
      <div class="header-inner">
        <div class="header-title header-title-entregar">Lista de Pedidos Para entregar</div>
      </div>
    </div>
<div class="hamburger-menu">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>
  <nav class="menu-panel">
    <a href="../htmlMesero/ordenesListas.html" class="menu-item">Pedidos listos en cocina</a>
    <a href="../htmlMesero/PrincipalMesero.html" class="menu-item">Toma de comandos</a>
  </nav>
</div>
   <!-- Icono superior -->
    <img class="top-icon" src="../imagenes/logo.jpg" alt="Icono">

    <!-- Logo -->

    <!-- Contenido principal -->
    <div class="main-content">
        
      <div class="orders-card">
        <img src="../imagenes/ok.jpg" alt="" class="okimg">
        <!-- Pedido 1 -->
        <div class="order-item item-1">
          <div class="order-block"></div>
          <div class="order-text">
            Mesa: 3<br>
            Comanda: <br>
            Coca cola (3x)<br>
            Sudao de pollo (1x)
          </div>
        </div>

        <!-- Pedido 2 -->
        <div class="order-item item-2">
          <div class="order-block"></div>
          <div class="order-text">
            Mesa: 2<br>
            Comanda: <br>
            Cafe con leche (2x)<br>
            Sopa de papa (1x)
          </div>
        </div>

        <!-- Pedido 3 -->
        <div class="order-item item-3">
          <div class="order-block"></div>
          <div class="order-text">
            Mesa: 1<br>
            Comanda: <br>
            Cafe con leche (4x)<br>
            Pan de queso (6x)
          </div>
        </div>

        <!-- Pedido 4 -->
        <div class="order-item item-4">
          <div class="order-block"></div>
          <div class="order-text">
            Mesa: 1<br>
            Comanda: <br>
