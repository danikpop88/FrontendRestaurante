<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reserva confirmada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Markazi+Text:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/cssCliente/reservaLista.css" />
</head>
<body>
  <div class="pantalla">

    <!-- Bloque verde con título -->
    <div class="hero">
      <div class="hero-titulo">Todo listo</div>
      <div class="hero-ilustracion">
        <img class="hero-img" src="../imagenes/reserva.png" alt="Ilustración" />
        <div class="hero-icono" data-size="48">
          <div class="hero-icono-borde"></div>
        </div>
      </div>
    </div>

    <!-- Encabezado -->
    <div class="header">
      <div class="header-fondo"></div>
      <a href="../htmlCliente/menu.html"><img class="header-usuario" src="../imagenes/logo.jpg" alt="Usuario" /></a>
    </div>
    <a href="../htmlCliente/menu.html"><img class="logo" src="../imagenes/icono.jpg" alt="Logo" /></a>

    <!-- Mensaje -->
    <div class="mensaje">Revisa tu bandeja de entrada. Recibirás un correo electrónico de confirmación en la próxima hora. Si no lo recibes, por favor contáctanos.</div>

    <!-- Tarjeta de datos -->
    <div class="tarjeta"></div>

    <div class="etiqueta et-nombre">Name</div>
    <div class="etiqueta et-email">Email</div>
    <div class="etiqueta et-celular">Celular</div>
    <div class="etiqueta et-fecha">Fecha</div>
    <div class="etiqueta et-hora">Hora</div>
    <div class="etiqueta et-personas">Número de personas</div>

    <div class="valor val-nombre">John Doe</div>
    <div class="valor val-email">JohnDoe@gmail.com</div>
    <div class="valor val-celular">+57  3116032432</div>
    <div class="valor val-fecha">20/09/2026</div>
    <div class="valor val-hora">6:00 PM</div>
    <div class="valor val-personas">4</div>

    <div class="linea linea-1"></div>
    <div class="linea linea-2"></div>
    <div class="linea linea-3"></div>
    <div class="linea linea-4"></div>
    <div class="linea linea-5"></div>

    <!-- Botón -->
    <div class="boton" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="boton-texto"><a href="../htmlCliente/menu.html">Volver</a></div>
    </div>

  </div>
</body>
</html>
