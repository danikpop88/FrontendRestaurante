<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Mesa</title>
  <link rel="stylesheet" href="../css/cssCliente/realizarReserva.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Header Images -->
    <a href="../htmlCliente/menu.html"><img class="top-logo" src="../imagenes/icono.jpg" alt="Logo"></a>
    <a href="../htmlCliente/menu.html"><img class="top-avatar" src="../imagenes/logo.jpg" alt="Avatar"></a>

    <!-- Stepper Section -->
    <div class="stepper-container">
      <div class="stepper-bg"></div>
      <div class="step-circle step-circle-1"></div>
      <div class="step-circle step-circle-2"></div>
      <div class="step-circle step-circle-3"></div>
      <div class="step-number step-number-1">1</div>
      <div class="step-number step-number-2">2</div>
      <div class="step-number step-number-3">3</div>
      <div class="step-label step-label-1">Buscar mesa</div>
      <div class="step-label step-label-2">Agregar tus datos</div>
      <div class="step-label step-label-3">Reservar</div>
    </div>

    <!-- Header Banner -->
    <div class="header-banner">
      <div class="header-title">Seleciona una fecha</div>
      <img class="header-icon" src="../imagenes/reserva.png" alt="Calendar Icon">
    </div>

    <!-- Form Section -->
    <div class="form-container">
      <div class="form-bg"></div>

      <!-- Field 1 -->
      <form id="form-reserva" action="#" method="POST">

  <!-- Field 1: Fecha -->
  <div class="input-group input-group-1" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
    <label for="fecha" class="input-label">¿Cuándo deseas reservar?</label>
    <div class="input-box">
      <input type="date" id="fecha" name="fecha" class="input-text" required>
      <div class="dropdown-icon-wrapper" data-size="16">
        <div class="dropdown-icon"></div>
      </div>
    </div>
  </div>

  <!-- Field 2: Hora -->
  <div class="input-group input-group-2" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
    <label for="hora" class="input-label">¿A qué hora?</label>
    <div class="input-box">
      <input type="time" id="hora" name="hora" class="input-text" required>
      <div class="dropdown-icon-wrapper" data-size="16">
        <div class="dropdown-icon"></div>
      </div>
    </div>
  </div>

  <!-- Field 3: Personas -->
  <div class="input-group input-group-3" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
    <label for="personas" class="input-label">¿Para cuántas personas?</label>
    <div class="input-box">
      <select id="personas" name="personas" class="input-text" required>
        <option value="" disabled selected>Selecciona cantidad</option>
        <option value="1">1 persona</option>
        <option value="2">2 personas</option>
        <option value="3">3 personas</option>
        <option value="4">4 personas</option>
        <option value="5">5 personas</option>
        <option value="6">6+ personas</option>
      </select>
      <div class="dropdown-icon-wrapper" data-size="16">
        <div class="dropdown-icon"></div>
      </div>
    </div>
  </div>

  <!-- Botón opcional de envío (si lo necesitas dentro del form) -->
  <!-- <button type="submit" class="boton-amarillo">Confirmar Reserva</button> -->

</form>

    <!-- Section Title -->
    <div class="section-title-container">
      <div class="section-title">HORARIOS DISPONIBLES</div>
      
      <div class="time-slots-container">
         <div class="time-slots-grid">
    <button class="time-slot-btn" data-hora="14:00">2:00 PM</button>
    <button class="time-slot-btn" data-hora="15:00">3:00 PM</button>
    <button class="time-slot-btn" data-hora="16:00">4:00 PM</button>
    <button class="time-slot-btn" data-hora="17:00">5:00 PM</button>
    <button class="time-slot-btn" data-hora="18:00">6:00 PM</button>
    <button class="time-slot-btn" data-hora="19:00">7:00 PM</button>
    <button class="time-slot-btn" data-hora="20:00">8:00 PM</button>
    <button class="time-slot-btn" data-hora="21:00">9:00 PM</button>
  </div>
 
      </div>
    </div>
    
    <!-- Decorative Card Frame -->
    <div class="card-frame"></div>

    <!-- Action Button -->
    <div class="btn-continue" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="btn-text"><a href="../htmlCliente/detallesCliente.html">Continuar</a></div>
    </div>

  </div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const inputHora = document.getElementById('hora');
    const botonesHorario = document.querySelectorAll('.time-slot-btn');

    botonesHorario.forEach(boton => {
      boton.addEventListener('click', () => {
        // 1. Obtener la hora del atributo data-hora
        const horaSeleccionada = boton.getAttribute('data-hora');

        // 2. Asignarla al input del formulario
        if (inputHora && horaSeleccionada) {
          inputHora.value = horaSeleccionada;
        }
      });
    });
  });
</script>
</body>
</html>
