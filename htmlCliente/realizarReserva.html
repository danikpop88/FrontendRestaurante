<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Mesa</title>
  <link rel="stylesheet" href="../css/cssCliente/realizarReserva.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Header Images -->
    <a href="../htmlCliente/menu.html"><img class="top-logo" src="../imagenes/icono.jpg" alt="Logo"></a>
    <a href="../htmlCliente/menu.html"><img class="top-avatar" src="../imagenes/logo.jpg" alt="Avatar"></a>

    <!-- Stepper Section -->
    <div class="stepper-container">
      <div class="stepper-bg"></div>
      <div class="step-circle step-circle-1"></div>
      <div class="step-circle step-circle-2"></div>
      <div class="step-circle step-circle-3"></div>
      <div class="step-number step-number-1">1</div>
      <div class="step-number step-number-2">2</div>
      <div class="step-number step-number-3">3</div>
      <div class="step-label step-label-1">Buscar mesa</div>
      <div class="step-label step-label-2">Agregar tus datos</div>
      <div class="step-label step-label-3">Reservar</div>
    </div>

    <!-- Header Banner -->
    <div class="header-banner">
      <div class="header-title">Seleciona una fecha</div>
      <img class="header-icon" src="../imagenes/reserva.png" alt="Calendar Icon">
    </div>

    <!-- Form Section -->
    <div class="form-container">
      <div class="form-bg"></div>

      <!-- Field 1 -->
      <div class="input-group input-group-1" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
        <div class="input-label">¿Cuándo deseas reservar?</div>
        <div class="input-box">
          <div class="input-text">Selecciona una fecha</div>
          <div class="dropdown-icon-wrapper" data-size="16">
            <div class="dropdown-icon"></div>
          </div>
        </div>
      </div>

      <!-- Field 2 -->
      <div class="input-group input-group-2" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
        <div class="input-label">¿A qué hora?</div>
        <div class="input-box">
          <div class="input-text">Selecciona una hora</div>
          <div class="dropdown-icon-wrapper" data-size="16">
            <div class="dropdown-icon"></div>
          </div>
        </div>
      </div>

      <!-- Field 3 -->
      <div class="input-group input-group-3" data-has-description="false" data-has-error="true" data-has-label="true" data-open="false" data-state="Default" data-value-type="Default">
        <div class="input-label">¿Para cuántas personas?</div>
        <div class="input-box">
          <div class="input-text">2 personas</div>
          <div class="dropdown-icon-wrapper" data-size="16">
            <div class="dropdown-icon"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-title-container">
      <div class="section-title">HORARIOS DISPONIBLES</div>
      
      <div class="time-slots-container">
         <div class="time-slots-grid">
    <button class="time-slot-btn">2:00 PM</button>
    <button class="time-slot-btn">3:00 PM</button>
    <button class="time-slot-btn">4:00 PM</button>
    <button class="time-slot-btn">5:00 PM</button>
    <button class="time-slot-btn">6:00 PM</button>
    <button class="time-slot-btn">7:00 PM</button>
    <button class="time-slot-btn">8:00 PM</button>
    <button class="time-slot-btn">9:00 PM</button>
  </div>
 
      </div>
    </div>
    
    <!-- Decorative Card Frame -->
    <div class="card-frame"></div>

    <!-- Action Button -->
    <div class="btn-continue" data-has-icon-end="false" data-has-icon-start="false" data-size="Medium" data-state="Default" data-variant="Primary">
      <div class="btn-text"><a href="../htmlCliente/detallesCliente.html">Continuar</a></div>
    </div>

  </div>

</body>
</html>
