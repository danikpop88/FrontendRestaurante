<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details</title>
    <link rel="stylesheet" href="../css/cssCliente/detallesCliente.css">
    <!-- Fuentes importadas desde Google Fonts para emular las del diseño -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Karla:wght@400;600;800&family=Markazi+Text:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    
    
    <div class="customer-details">
        
        <!-- Barra de Navegación -->
        <nav class="navigation-bar">
            <div class="nav-background"></div>
          
            <a href="../htmlCliente/menu.html"><img class="nav-image" src="../imagenes/logo.jpg" alt="Profile"></a>
        </nav>

<div class="hamburger-menu">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>
  <nav class="menu-panel">
    <br>
    <a href="../htmlCliente/realizarReserva.html" class="menu-item">Volver</a>
    <a href="../htmlCliente/pedido.html" class="menu-item">Realizar pedido</a>
  </nav>
</div>

        <!-- Barra de Progreso -->
        <div class="progress-bar">                    
            <div class="progress-background"></div>
            
            <div class="progress-step step-1">
                <div class="step-circle circle-inactive"></div>
                <div class="step-number number-inactive">1</div>
                <div class="step-label">Buscar mesa</div>
            </div>
            
            <div class="progress-step step-2">
                <div class="step-circle circle-active"></div>
                <div class="step-number number-active">2</div>
                <div class="step-label">Agregar tus datos</div>
            </div>
            
            <div class="progress-step step-3">
                <div class="step-circle circle-inactive"></div>
                <div class="step-number number-inactive">3</div>
                <div class="step-label">Reservar</div>
            </div>
        </div>

        <!-- Encabezado Hero -->
        <header class="hero-section">
            <h1 class="hero-title">Tu información</h1>
            <img class="hero-img img-right" src="../imagenes/reserva.png" alt="Decoration">
            <img class="hero-img img-left" src="../imagenes/reserva.png" alt="Decoration">
        </header>

        <!-- Sección de Detalles de la Reserva (Personas, Hora, Fecha) -->
        <section class="reservation-details">
            <div class="details-card">
                <div class="detail-item">
                    <span class="detail-label">Personas</span>
                    <span class="detail-value">4</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Hora</span>
                    <span class="detail-value">6:00PM</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Fecha</span>
                    <span class="detail-value">1 agosto</span>
                </div>
                <!-- Iconos Chevron -->
                <div class="chevron-icon chevron-1"></div>
                <div class="chevron-icon chevron-2"></div>
                <div class="chevron-icon chevron-3"></div>
                <!-- Líneas divisorias -->
                <div class="divider-line line-1"></div>
                <div class="divider-line line-2"></div>
            </div>
        </section>

        <!-- Formulario de Información del Cliente -->
<form id="reserva-form" class="form-container" action="../htmlCliente/revisaReserva.html" method="GET">
    
    <div class="input-field">
        <label for="nombres" class="input-label">Nombres*</label>
        <input 
            type="text" 
            id="nombres" 
            name="nombres" 
            class="input-box input-value" 
            placeholder="Primer Nombre" 
            required
        >
    </div>

    <div class="input-field">
        <label for="apellidos" class="input-label">Apellidos*</label>
        <input 
            type="text" 
            id="apellidos" 
            name="apellidos" 
            class="input-box input-value" 
            placeholder="Apellidos" 
            required
        >
    </div>

    <div class="input-field">
        <label for="email" class="input-label">Email*</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-box input-value" 
            placeholder="Email" 
            required
        >
    </div>

    <div class="input-field">
        <label for="telefono" class="input-label">Número de teléfono</label>
        <input 
            type="tel" 
            id="telefono" 
            name="telefono" 
            class="input-box input-value" 
            placeholder="+57"
        >
    </div>

    <div class="select-field">
        <label for="ocasion" class="input-label">Seleccione una ocasión (opcional)</label>
        <select id="ocasion" name="ocasion" class="select-box select-value">
            <option value="" disabled selected hidden>Seleccione una ocasión</option>
            <option value="cumpleanos">Cumpleaños</option>
            <option value="aniversario">Aniversario</option>
            <option value="reunion">Reunión de trabajo</option>
            <option value="otro">Otro</option>
        </select>
    </div>

    <!-- Botón de Envío -->
   

</form>
<div class="button-container">
    <button type="submit" form="reserva-form" class="btn-continue">Continuar</button>
</div>
        <!-- Logo inferior -->
        <img class="bottom-logo" src="https://placehold.co/179x60" alt="Logo">

    </div>

</body>
</html>
