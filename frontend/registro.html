<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Karla:wght@700;800&family=Markazi+Text:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <div class="pantalla">
    <div class="topbar"><img class="topbar-avatar" src="imagenes/logo.jpg" alt="Usuario"></div>
    <img class="logo-principal" src="imagenes/icono.jpg" alt="Logo">
    <div class="header"><div class="header-titulo">Registro</div></div>

    <form id="form-registro" class="form-card" style="padding:20px 16px">
      <div class="campo">
        <label class="campo-label" for="nombre">Nombre completo</label>
        <div class="campo-input"><input class="campo-texto" id="nombre" type="text" required style="border:none;outline:none;width:100%"></div>
      </div>
      <div class="campo">
        <label class="campo-label" for="telefono">Teléfono</label>
        <div class="campo-input"><input class="campo-texto" id="telefono" type="tel" required style="border:none;outline:none;width:100%"></div>
      </div>
      <div class="campo">
        <label class="campo-label" for="email">Correo electrónico</label>
        <div class="campo-input"><input class="campo-texto" id="email" type="email" required style="border:none;outline:none;width:100%"></div>
      </div>
      <div class="campo">
        <label class="campo-label" for="contrasena">Contraseña (mínimo 12 caracteres)</label>
        <div class="campo-input"><input class="campo-texto" id="contrasena" type="password" required autocomplete="new-password" style="border:none;outline:none;width:100%"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;width:344px">
        <input type="checkbox" id="acepta"> Acepto el tratamiento de mis datos personales.
      </label>
      <div id="mensajes" class="v-mensajes"></div>
    </form>

    <button type="submit" form="form-registro" class="boton-registrarse boton-texto" style="border:none;cursor:pointer">Registrarse</button>
    <a href="login.html" style="position:absolute;left:0;width:100%;top:812px;text-align:center;color:#495E57;font:600 14px Karla,sans-serif;text-decoration:none">¿Ya tiene cuenta? Inicie sesión</a>
  </div>

  <script src="js/cliente_api.js"></script>
  <script src="js/autenticacion.js"></script>
</body>
</html>
