<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Domiciliario</title>
    <link rel="stylesheet" href="../css/cssDomiciliario/chatDomiciliario.css">
    <!-- Fuentes importadas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="domiciliario-chat">
        
        <!-- Encabezado Hero (Chat) -->
        <header class="hero-section">
            <div class="hero-title-empty"></div>
            <div class="hero-title">
                <h1 class="hero-title-main">Chat</h1>
            </div>
        </header>

        <!-- Barra Superior (Logo, Iconos) -->
        <div class="top-logo"></div>
        <div class="top-vector"></div>
        <img class="top-profile-image" src="../imagenes/logo.jpg" alt="Perfil">
        <img class="top-brand-image" src="../imagenes/icono.jpg" alt="Logo">

        <!-- Área de Mensajes (Fondo) -->
        <img class="chat-background" src="../imagenes/teclado.png" alt="Fondo de chat">

        <!-- Barra de Entrada de Mensaje -->
        <div class="message-input-bar">
            <div class="send-button-circle"></div>
            <img class="send-icon" src="../imagenes/flechaBlanca.png" alt="Enviar">
        </div>

        <!-- Información del Cliente en el Chat -->
        <div class="client-name">Nombre cliente</div>
        <img class="client-avatar" src="../imagenes/telefono.png" alt="Avatar">

        <!-- Imágenes Decorativas Flotantes -->
        <img class="floating-image img-left" src="../imagenes/flechaRegreso.png" alt="Decoración">

    </div>

</body>
</html>
