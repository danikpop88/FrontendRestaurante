<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Pedido - Domiciliario</title>
    <link rel="stylesheet" href="../css/cssDomiciliario/detallesPedido.css">
    <!-- Fuentes importadas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&family=Markazi+Text:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="domiciliario-detalles">
        
        <!-- Encabezado Hero (Detalles de pedido) -->
        <header class="hero-section">
            <div class="hero-title">
                <h1 class="hero-title-main">Detalles de pedido:</h1>
            </div>
        </header>

        <!-- Barra Superior (Logo, Iconos) -->
        <div class="top-logo"></div>
        <div class="top-vector"></div>
        <div class="top-line"></div>
        <img class="top-profile-image" src="../imagenes/logo.jpg" alt="Perfil">
        <img class="top-brand-image" src="../imagenes/icono.jpg" alt="Logo">

        <!-- Tarjeta de Información del Pedido -->
        <div class="info-card">
            <h2 class="info-card-title">Información sobre el pedido:</h2>
            
            <div class="info-row label-nombre">Nombre:</div>
            <div class="info-row label-telefono">Teléfono:</div>
            <div class="info-row label-direccion">Dirección:</div>
            <div class="info-row label-especificaciones">Especificaciones:</div>
            <div class="info-row label-pedido">Pedido:</div>

            <!-- Botones de Acción (Llamar / Enviar mensaje) -->
            <div class="button-primary btn-llamar">
                <span class="button-label">Llamar</span>
            </div>
            <div class="button-primary btn-mensaje">
                <span class="button-label">Enviar mensaje</span>
            </div>

            <!-- Botones de Estado (Entregado / Devuelto) -->
            <div class="button-primary btn-entregado">
                <span class="button-label">Marcar como entregado</span>
            </div>
            <div class="button-primary btn-devuelto">
                <span class="button-label">Marcar como devuelto</span>
            </div>
        </div>

        <!-- Imágenes Decorativas Flotantes -->
        <img class="floating-image img-left" src="../imagenes/flechaRegreso.png" alt="Decoración">

    </div>

</body>
</html>
