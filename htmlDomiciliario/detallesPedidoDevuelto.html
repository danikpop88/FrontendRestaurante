<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Pedido (Devuelto) - Domiciliario</title>
    <link rel="stylesheet" href="../css/cssDomiciliario/detallesPedidoDevuelto.css">
    <!-- Fuentes importadas desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&family=Markazi+Text:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="domiciliario-detalles">
        
        <!-- Encabezado Hero (Detalles de pedido) -->
        <header class="hero-section">
            <div class="hero-title">
                <h1 class="hero-title-main">Detalles de pedido:</h1>
            </div>
        </header>

        <!-- Barra Superior (Logo, Iconos) -->
        <div class="top-logo"></div>
             <div class="hamburger-menu">
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>
  <nav class="menu-panel">
    <br>
    <a href="../htmlDomiciliario/detallesPedido.html" class="menu-item">Volver</a>
    <a href="../htmlDomiciliario/estadoPedido.html" class="menu-item">Domicilios entregados</a>
    <a href="../htmlDomiciliario/entregasDomiciliario.html" class="menu-item">Domicilios asignados</a>
  </nav>
</div>
        <div class="top-line"></div>
        <a href="../htmlDomiciliario/bienvenidoDomiciliario.html"><img class="top-profile-image" src="../imagenes/logo.jpg" alt="Perfil"></a>
        <a href="../htmlDomiciliario/bienvenidoDomiciliario.html"><img class="top-brand-image" src="../imagenes/icono.jpg" alt="Logo"></a>

        <!-- Tarjeta de Información del Pedido -->
        <div class="info-card">
            <h2 class="info-card-title">Información sobre el pedido:</h2>
            
            <div class="info-row label-nombre">Nombre:</div>
            <div class="info-row label-telefono">Teléfono:</div>
            <div class="info-row label-direccion">Dirección:</div>
            <div class="info-row label-especificaciones">Especificaciones:</div>
            <div class="info-row label-pedido">Pedido:</div>

            <!-- Estado del Pedido (Devuelto) -->
            <div class="status-text">Devuelto</div>
            <div class="status-circle"></div>

            <!-- Botones de Acción (Llamar / Enviar mensaje) -->
            <div class="button-primary btn-llamar">
                <a href="../htmlDomiciliario/chatDomiciliario.html"><span class="button-label">Llamar</span></a>
            </div>
            <div class="button-primary btn-mensaje">
                <a href="../htmlDomiciliario/chatDomiciliario.html"><span class="button-label">Enviar mensaje</span></a>
            </div>
        </div>



    </div>

</body>
